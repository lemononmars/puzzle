<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Breaker - Facebook Banner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0b0f19;
      color: #ffffff;
      font-family:'DM Sans','Noto Sans Thai',sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      color: #facc15;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
    }
    .banner-wrapper {
      width: 100%;
      max-width: 1200px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #000;
    }
    .banner-wrapper svg, .banner-wrapper img {
      display: block;
      width: 100%;
      height: auto;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      max-width: 1200px;
      width: 100%;
      margin-top: 30px;
    }
    .info-card {
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Code Breaker — Facebook Banner (7 Puzzle Types)</h1>
    <p>7 Rainbow Sections • Riddle, Language, Math, Logic, Visual, Quiz, Physical • Pure White Icons</p>
  </div>

  <div class="banner-wrapper">
    <img src="codebreaker-7th-anniversary-banner.svg" alt="Code Breaker Facebook Banner" />
  </div>

  <div class="info-grid">
    <div class="info-card" style="background: rgba(225, 29, 72, 0.2); border: 1px solid #e11d48; color: #fda4af;">
      <div>Red</div>
      <div style="font-size: 15px; font-weight: 800; color: #fff; margin-top: 4px;">Riddle</div>
      <div style="font-family:'DM Sans','Noto Sans Thai',sans-serif; font-size: 13px;">เชาวน์</div>
    </div>
    <div class="info-card" style="background: rgba(234, 88, 12, 0.2); border: 1px solid #ea580c; color: #fed7aa;">
      <div>Orange</div>
      <div style="font-size: 15px; font-weight: 800; color: #fff; margin-top: 4px;">Language</div>
      <div style="font-family:'DM Sans','Noto Sans Thai',sans-serif; font-size: 13px;">ภาษา</div>
    </div>
    <div class="info-card" style="background: rgba(234, 179, 8, 0.2); border: 1px solid #eab308; color: #fef08a;">
      <div>Yellow</div>
      <div style="font-size: 15px; font-weight: 800; color: #fff; margin-top: 4px;">Math</div>
      <div style="font-family:'DM Sans','Noto Sans Thai',sans-serif; font-size: 13px;">คำนวณ</div>
    </div>
    <div class="info-card" style="background: rgba(5, 150, 105, 0.2); border: 1px solid #059669; color: #a7f3d0;">
      <div>Green</div>
      <div style="font-size: 15px; font-weight: 800; color: #fff; margin-top: 4px;">Logic</div>
      <div style="font-family:'DM Sans','Noto Sans Thai',sans-serif; font-size: 13px;">ตรรกะ</div>
    </div>
    <div class="info-card" style="background: rgba(2, 132, 199, 0.2); border: 1px solid #0284c7; color: #bae6fd;">
      <div>Cyan</div>
      <div style="font-size: 15px; font-weight: 800; color: #fff; margin-top: 4px;">Visual</div>
      <div style="font-family:'DM Sans','Noto Sans Thai',sans-serif; font-size: 13px;">ภาพ</div>
    </div>
    <div class="info-card" style="background: rgba(79, 70, 229, 0.2); border: 1px solid #4f46e5; color: #c7d2fe;">
      <div>Indigo</div>
      <div style="font-size: 15px; font-weight: 800; color: #fff; margin-top: 4px;">Quiz</div>
      <div style="font-family:'DM Sans','Noto Sans Thai',sans-serif; font-size: 13px;">คำถาม</div>
    </div>
    <div class="info-card" style="background: rgba(147, 51, 234, 0.2); border: 1px solid #9333ea; color: #e9d5ff;">
      <div>Violet</div>
      <div style="font-size: 15px; font-weight: 800; color: #fff; margin-top: 4px;">Physical</div>
      <div style="font-family:'DM Sans','Noto Sans Thai',sans-serif; font-size: 13px;">ชิ้นส่วน</div>
    </div>
  </div>
</body>
</html>
