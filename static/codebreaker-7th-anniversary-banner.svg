<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 800" width="2100" height="800">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;600&display=swap');
      
      .font-brand { font-family:'DM Sans','Noto Sans Thai',sans-serif; }
      .font-thai { font-family:'DM Sans','Noto Sans Thai',sans-serif; }
      
      .icon-shadow {
        filter: drop-shadow(0 12px 24px rgba(0,0,0,0.4));
      }
      .text-shadow {
        filter: drop-shadow(0 4px 14px rgba(0,0,0,0.7));
      }
    </style>

    <!-- Rainbow Gradients (7 Sections) -->
    <linearGradient id="grad-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="40%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="40%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>

    <linearGradient id="grad-yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>

    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <linearGradient id="grad-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <linearGradient id="grad-indigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="40%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <linearGradient id="grad-violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="40%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>

    <!-- Overlay Vignette -->
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- ==================== 7 RAINBOW BACKGROUND SECTIONS (SOLID GRADIENTS) ==================== -->
  
  <g id="sec-1"><rect x="0" y="0" width="300" height="800" fill="url(#grad-red)"/></g>
  <g id="sec-2"><rect x="300" y="0" width="300" height="800" fill="url(#grad-orange)"/></g>
  <g id="sec-3"><rect x="600" y="0" width="300" height="800" fill="url(#grad-yellow)"/></g>
  <g id="sec-4"><rect x="900" y="0" width="300" height="800" fill="url(#grad-green)"/></g>
  <g id="sec-5"><rect x="1200" y="0" width="300" height="800" fill="url(#grad-cyan)"/></g>
  <g id="sec-6"><rect x="1500" y="0" width="300" height="800" fill="url(#grad-indigo)"/></g>
  <g id="sec-7"><rect x="1800" y="0" width="300" height="800" fill="url(#grad-violet)"/></g>

  <!-- Subtle Column Dividers -->
  <g stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2">
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
    <line x1="1200" y1="0" x2="1200" y2="800"/>
    <line x1="1500" y1="0" x2="1500" y2="800"/>
    <line x1="1800" y1="0" x2="1800" y2="800"/>
  </g>

  <!-- Vignette Overlay -->
  <rect x="0" y="0" width="2100" height="800" fill="url(#vignette)" pointer-events="none"/>

  <!-- ==================== 7 PUZZLE TYPES & PURE WHITE ICONS ==================== -->

  <!-- SECTION 1: RIDDLE / เชาวน์ (x: 150) -->
  <g class="icon-shadow" transform="translate(150, 300)">
    <g stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Lightbulb glass dome -->
      <path d="M-34 -30 C-34 -58 34 -58 34 -30 C34 -12 18 4 18 22 H-18 C-18 4 -34 -12 -34 -30 Z" fill="#FFFFFF" fill-opacity="0.2"/>
      <!-- Filament inside -->
      <path d="M-12 -16 L-6 -38 L6 -38 L12 -16" stroke-width="4.5"/>
      <!-- Base screw threads -->
      <line x1="-16" y1="32" x2="16" y2="32" stroke-width="5.5"/>
      <line x1="-12" y1="42" x2="12" y2="42" stroke-width="5.5"/>
      <path d="M-8 42 C-8 52 8 52 8 42" fill="#FFFFFF"/>
      
      <!-- 5 Rays evenly spaced across dome (angles: -60°, -30°, 0°, 30°, 60°) -->
      <line x1="-48" y1="-58" x2="-62" y2="-66" stroke-width="6"/>
      <line x1="-28" y1="-78" x2="-36" y2="-92" stroke-width="6"/>
      <line x1="0" y1="-84" x2="0" y2="-100" stroke-width="6"/>
      <line x1="28" y1="-78" x2="36" y2="-92" stroke-width="6"/>
      <line x1="48" y1="-58" x2="62" y2="-66" stroke-width="6"/>
    </g>

    <!-- Typography -->
    <text x="0" y="165" text-anchor="middle" fill="#FFFFFF" class="font-brand text-shadow" font-weight="900" font-size="34" letter-spacing="2">RIDDLE</text>
    <text x="0" y="240" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.98" class="font-thai text-shadow" font-weight="700" font-size="56">เชาวน์</text>
  </g>

  <!-- SECTION 2: LANGUAGE / ภาษา (x: 450) -->
  <g class="icon-shadow" transform="translate(450, 300)">
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- Back Bubble (Upper Left with 'A') -->
      <path d="M-42 -64 H10 C22 -64 30 -56 30 -44 V-10 C30 2 22 10 10 10 H-16 L-34 26 V10 H-42 C-54 10 -62 2 -62 -10 V-44 C-62 -56 -54 -64 -42 -64 Z" 
            fill="#EA580C" stroke="#FFFFFF" stroke-width="6"/>
      <text x="-16" y="-18" font-family="DM Sans, Noto Serif Thai" font-weight="400" font-size="36" fill="#FFFFFF" text-anchor="middle">A</text>
      
      <!-- Front Bubble (Lower Right with 'ก') -->
      <path d="M2 -14 H54 C66 -14 74 -6 74 6 V40 C74 52 66 60 54 60 H46 L32 74 V60 H2 C-10 60 -18 52 -18 40 V6 C-18 -6 -10 -14 2 -14 Z" 
            fill="#D94E07" stroke="#FFFFFF" stroke-width="6"/>
      <text x="28" y="32" font-family="DM Sans, Noto Serif Thai" font-weight="400" font-size="36" fill="#FFFFFF" text-anchor="middle">ก</text>
    </g>

    <!-- Typography -->
    <text x="0" y="165" text-anchor="middle" fill="#FFFFFF" class="font-brand text-shadow" font-weight="900" font-size="34" letter-spacing="2">LANGUAGE</text>
    <text x="0" y="240" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.98" class="font-thai text-shadow" font-weight="700" font-size="56">ภาษา</text>
  </g>

  <!-- SECTION 3: MATH / คำนวณ (x: 750) -->
  <g class="icon-shadow" transform="translate(750, 300)">
    <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="-60" y="-60" width="120" height="120" rx="20" fill="#FFFFFF" fill-opacity="0.18"/>
      <line x1="0" y1="-50" x2="0" y2="50" stroke-opacity="0.5"/>
      <line x1="-50" y1="0" x2="50" y2="0" stroke-opacity="0.5"/>
      
      <!-- Top-Left: Plus + -->
      <line x1="-30" y1="-42" x2="-30" y2="-18" stroke-width="6"/>
      <line x1="-42" y1="-30" x2="-18" y2="-30" stroke-width="6"/>
      
      <!-- Top-Right: Minus − -->
      <line x1="18" y1="-30" x2="42" y2="-30" stroke-width="6"/>
      
      <!-- Bottom-Left: Multiply × -->
      <line x1="-38" y1="22" x2="-22" y2="38" stroke-width="6"/>
      <line x1="-22" y1="22" x2="-38" y2="38" stroke-width="6"/>
      
      <!-- Bottom-Right: Division ÷ (with hollow donut circles) -->
      <line x1="18" y1="30" x2="42" y2="30" stroke-width="6"/>
      <circle cx="30" cy="16" r="5" stroke="#FFFFFF" stroke-width="3" fill="none"/>
      <circle cx="30" cy="44" r="5" stroke="#FFFFFF" stroke-width="3" fill="none"/>
    </g>

    <!-- Typography -->
    <text x="0" y="165" text-anchor="middle" fill="#FFFFFF" class="font-brand text-shadow" font-weight="900" font-size="34" letter-spacing="2">MATH</text>
    <text x="0" y="240" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.98" class="font-thai text-shadow" font-weight="700" font-size="56">คำนวณ</text>
  </g>

  <!-- SECTION 4: LOGIC / ตรรกะ (x: 1050) -->
  <g class="icon-shadow" transform="translate(1050, 300)">
    <!-- Pure White Icon: Round, Proportional, Perfectly Meshed Gears -->
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      
      <!-- Large Gear (8 proportional teeth, centered at -18, -16) -->
      <g transform="translate(-18, -16)">
        <!-- 8 Teeth rotated around center -->
        <rect x="-5" y="-36" width="10" height="12" rx="3"/>
        <rect x="-5" y="-36" width="10" height="12" rx="3" transform="rotate(45)"/>
        <rect x="-5" y="-36" width="10" height="12" rx="3" transform="rotate(90)"/>
        <rect x="-5" y="-36" width="10" height="12" rx="3" transform="rotate(135)"/>
        <rect x="-5" y="-36" width="10" height="12" rx="3" transform="rotate(180)"/>
        <rect x="-5" y="-36" width="10" height="12" rx="3" transform="rotate(225)"/>
        <rect x="-5" y="-36" width="10" height="12" rx="3" transform="rotate(270)"/>
        <rect x="-5" y="-36" width="10" height="12" rx="3" transform="rotate(315)"/>
        <!-- Main Circular Gear Body with Center Bore Hole -->
        <circle cx="0" cy="0" r="28" fill="#059669" stroke-width="6"/>
        <circle cx="0" cy="0" r="10" fill="#059669" stroke-width="5"/>
      </g>

      <!-- Small Gear (6 proportional teeth, centered at 28, 22) -->
      <g transform="translate(28, 22)">
        <!-- 6 Teeth rotated around center (rotated 15 deg for pitch engagement) -->
        <rect x="-4" y="-27" width="8" height="10" rx="2.5" transform="rotate(15)"/>
        <rect x="-4" y="-27" width="8" height="10" rx="2.5" transform="rotate(75)"/>
        <rect x="-4" y="-27" width="8" height="10" rx="2.5" transform="rotate(135)"/>
        <rect x="-4" y="-27" width="8" height="10" rx="2.5" transform="rotate(195)"/>
        <rect x="-4" y="-27" width="8" height="10" rx="2.5" transform="rotate(255)"/>
        <rect x="-4" y="-27" width="8" height="10" rx="2.5" transform="rotate(315)"/>
        <!-- Main Circular Gear Body with Center Bore Hole -->
        <circle cx="0" cy="0" r="20" fill="#059669" stroke-width="5"/>
        <circle cx="0" cy="0" r="7" fill="#059669" stroke-width="4"/>
      </g>
    </g>

    <!-- Typography -->
    <text x="0" y="165" text-anchor="middle" fill="#FFFFFF" class="font-brand text-shadow" font-weight="900" font-size="34" letter-spacing="2">LOGIC</text>
    <text x="0" y="240" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.98" class="font-thai text-shadow" font-weight="700" font-size="56">ตรรกะ</text>
  </g>

  <!-- SECTION 5: VISUAL / ภาพ (x: 1350) -->
  <g class="icon-shadow" transform="translate(1350, 300)">
    <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-62 0 C-36 -44 36 -44 62 0 C36 44 -36 44 -62 0 Z" fill="#FFFFFF" fill-opacity="0.2"/>
      <circle cx="0" cy="0" r="22" stroke-width="6"/>
      <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
      <circle cx="6" cy="-6" r="3.5" fill="#0284C7"/>

      <path d="M-56 -36 H-70 V-22" stroke-width="5"/>
      <path d="M56 -36 H70 V-22" stroke-width="5"/>
      <path d="M-56 36 H-70 V22" stroke-width="5"/>
      <path d="M56 36 H70 V22" stroke-width="5"/>
    </g>

    <!-- Typography -->
    <text x="0" y="165" text-anchor="middle" fill="#FFFFFF" class="font-brand text-shadow" font-weight="900" font-size="34" letter-spacing="2">VISUAL</text>
    <text x="0" y="240" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.98" class="font-thai text-shadow" font-weight="700" font-size="56">ภาพ</text>
  </g>

  <!-- SECTION 6: QUIZ / คำถาม (x: 1650) -->
  <g class="icon-shadow" transform="translate(1650, 300)">
    <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M0 -64 L52 -38 V8 C52 40 0 66 0 66 C0 66 -52 40 -52 8 V-38 Z" fill="#FFFFFF" fill-opacity="0.2" stroke-width="6"/>
      <path d="M-16 -24 C-16 -40 16 -40 16 -24 C16 -12 0 -6 0 8" stroke-width="8"/>
      <circle cx="0" cy="24" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Typography -->
    <text x="0" y="165" text-anchor="middle" fill="#FFFFFF" class="font-brand text-shadow" font-weight="900" font-size="34" letter-spacing="2">QUIZ</text>
    <text x="0" y="240" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.98" class="font-thai text-shadow" font-weight="700" font-size="56">คำถาม</text>
  </g>

  <!-- SECTION 7: PHYSICAL / ชิ้นส่วน (x: 1950) -->
  <g class="icon-shadow" transform="translate(1950, 300)">
    <g stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -44,-44 
               H -14 C -14,-56 -24,-66 0,-66 C 24,-66 14,-56 14,-44 
               H 44 
               V -14 C 56,-14 66,-24 66,0 C 66,24 56,14 44,14 
               V 44 
               H 14 C 14,32 24,22 0,22 C -24,22 -14,32 -14,44 
               H -44 
               V 14 C -32,14 -22,24 -22,0 C -22,-24 -32,-14 -44,-14 
               Z" 
            fill="#FFFFFF" fill-opacity="0.22"/>
    </g>

    <!-- Typography -->
    <text x="0" y="165" text-anchor="middle" fill="#FFFFFF" class="font-brand text-shadow" font-weight="900" font-size="34" letter-spacing="2">PHYSICAL</text>
    <text x="0" y="240" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.98" class="font-thai text-shadow" font-weight="700" font-size="56">ชิ้นส่วน</text>
  </g>

</svg>
