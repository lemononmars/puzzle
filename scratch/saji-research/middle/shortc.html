<body>
  <main class="game">
    <header><h1>short cut</h1><button class="settings-button" id="settings-open" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m9 3-.7 2.2-2 .9L4 5.7 2 9l1.7 1.8v2.4L2 15l2 3.3 2.3-.4 2 .9L9 21h4l.7-2.2 2-.9 2.3.4 2-3.3-1.7-1.8v-2.4L20 9l-2-3.3-2.3.4-2-.9L13 3Z"/><circle cx="11" cy="12" r="3"/></svg></button></header>
    <section class="instructions"><p id="instruction">黄赤の時は止まろう！</p></section>
    <div class="scoreboard"><div><svg id="clock" class="clock" viewBox="0 0 64 64" role="img" aria-label="残り時間の時計"><circle class="clock-face" cx="32" cy="32" r="28"/><path class="clock-ticks" d="M32 7v5 M57 32h-5 M32 57v-5 M7 32h5 M19.5 10.4l2 3.5 M44.5 10.4l-2 3.5 M53.6 19.5l-3.5 2 M53.6 44.5l-3.5-2 M44.5 53.6l-2-3.5 M19.5 53.6l2-3.5 M10.4 44.5l3.5-2 M10.4 19.5l3.5 2"/><path id="clock-hand" d="M32 35V15"/><circle cx="32" cy="32" r="2.5" fill="currentColor"/></svg></div><div aria-label="通した車"><strong id="count">0/10</strong><span class="unit" id="score-unit">台</span></div></div>
    <section class="scene" aria-label="道路と信号機">
      <div class="signal-post"></div><div class="traffic-light" role="img" aria-label="信号機"><i class="lamp green"></i><i class="lamp yellow"></i><i class="lamp red on"></i></div>
      <div class="road"><div class="lane-mark" aria-hidden="true"></div><div class="stop-line" aria-hidden="true"></div><div id="cars" aria-hidden="true"><div class="car waiting"><span></span></div></div></div>
    </section>
    <div class="controls"><p id="status" role="status">準備ができたら、スタート。</p><button id="start" class="primary">スタート</button><div id="play-actions" hidden><button id="drive" class="drive">GO!</button><button id="restart" class="restart">リスタート</button></div></div>
  </main>
  <dialog id="settings" aria-labelledby="settings-title"><div class="dialog-heading"><h2 id="settings-title">設定</h2><button class="close" id="settings-close" aria-label="設定を閉じる" data-close="settings">×</button></div><fieldset class="language-picker"><legend id="language-label">表示言語</legend><button class="language-button" type="button" data-language="ja" aria-pressed="true">日本語</button><button class="language-button" type="button" data-language="en" aria-pressed="false">English</button></fieldset><div class="volume-heading"><label class="volume-label" for="volume"><span id="volume-label-text">SE音量</span> <output id="volume-value">65%</output></label><button id="mute" class="mute-button" type="button" aria-pressed="false">ミュート</button></div><input type="range" id="volume" min="0" max="100" step="5" value="65"><nav class="settings-links" id="settings-links" aria-label="関連リンク"><a href="https://note.com/saji_q/n/ndf67bfc443b6" target="_blank" rel="noopener noreferrer"><strong id="hint-link">ヒント・解説 ↗</strong><span id="hint-copy">すべてのWEB謎のヒントと解説を、この有料記事ひとつで楽しめます。</span></a><a href="https://sajiqook.jp/game/" target="_blank" rel="noopener noreferrer"><strong id="games-link">他のゲーム ↗</strong></a></nav><p class="settings-note" id="settings-note">この画面の設定、内容は謎解きとは関係ありません。</p></dialog>
  <dialog id="records" aria-labelledby="records-title"><div class="dialog-heading"><h2 id="records-title">きろく</h2><button class="close" id="records-close" aria-label="きろくを閉じる" data-close="records">×</button></div><p id="records-status" class="records-status" role="status" aria-live="polite"></p><dl id="records-totals" class="records-totals" hidden><div><dt id="records-plays-label">総プレイ回数</dt><dd id="records-plays">—</dd></div><div><dt id="records-clears-label">クリア回数</dt><dd id="records-clears">—</dd></div><div><dt id="records-rate-label">クリア率</dt><dd id="records-rate">—</dd></div></dl><section id="records-breakdown" class="records-breakdown" hidden><h3 id="records-breakdown-title">クリア詳細</h3><dl class="score-details"><div><dt data-score-label="10">10台</dt><dd><span id="records-score-10">—</span><small data-people-unit>人</small></dd></div><div><dt data-score-label="11">11台</dt><dd><span id="records-score-11">—</span><small data-people-unit>人</small></dd></div><div><dt data-score-label="12">12台</dt><dd><span id="records-score-12">—</span><small data-people-unit>人</small></dd></div><div><dt data-score-label="13">13台</dt><dd><span id="records-score-13">—</span><small data-people-unit>人</small></dd></div><div><dt data-score-label="14">14台</dt><dd><span id="records-score-14">—</span><small data-people-unit>人</small></dd></div><div><dt data-score-label="15">15台</dt><dd><span id="records-score-15">—</span><small data-people-unit>人</small></dd></div><div id="records-unclassified-row" class="score-details-wide" hidden><dt id="records-unclassified-label">内訳記録前</dt><dd><span id="records-unclassified">—</span><small data-people-unit>人</small></dd></div></dl></section><p class="settings-note" id="records-note">この画面は謎解きとは関係ありません。</p></dialog>
  <dialog id="result" aria-labelledby="result-title"><div class="dialog-heading"><span aria-hidden="true"></span><button class="close" id="result-close" aria-label="結果を閉じる" data-close="result">×</button></div><h2 id="result-title">TIME UP</h2><p class="result-score"><strong id="result-count">0</strong> <span id="result-unit">台</span></p><p id="result-message"></p><a id="share" class="primary share" href="https://x.com/intent/tweet" target="_blank" rel="noopener noreferrer">Xに記録をシェア</a><button id="retry" class="secondary">もう一度挑戦する</button></dialog>
