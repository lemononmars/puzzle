<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>めばかり — ふたつの図形を、同じ面積に。</title>
<meta name="description" content="ふたつの図形を同じ面積に揃えるだけのゲーム。">
<style>
:root{
  color-scheme: light;
  --paper:#fbfaf7; --ink:#1b1a17; --sub:#6d6759; --line:#ded9cb;
  --gray:#bcb7a8; --accent:#c8452e; --accent-w:#f3e2dd;
  --g1:#c8452e; --g2:#1b1a17; --g3:#6d6759; --g4:#9b9486; --g5:#c6c0b0; --g6:#e4dfd1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
.app{max-width:760px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;min-height:100vh}

header{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;line-height:0;cursor:pointer}
.logo{display:block;height:34px;width:auto}
header .meta{margin-left:auto;display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.chip{border:1px solid var(--line);border-radius:2px;padding:3px 8px;background:#fff}
#langBtn{border:1px solid var(--line);background:#fff;color:var(--sub);font:inherit;font-size:11px;
  padding:4px 8px;border-radius:2px;cursor:pointer;letter-spacing:.06em}

section{flex:1;display:flex;flex-direction:column}
[hidden]{display:none!important}

/* ---------- menu ---------- */
#menu{justify-content:flex-start;gap:22px;padding:36px 0 8px}
.tag{font-size:15px;color:var(--sub);margin:0;letter-spacing:.04em;line-height:1.8}
.tag b{color:var(--ink);font-weight:700}
.modes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mode{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:3px;padding:14px 16px;font:inherit;color:inherit;cursor:pointer}
.mode:hover{border-color:var(--ink)}
.mode .mname{font-size:16px;font-weight:700;letter-spacing:.1em;min-width:7.5em}
.mode .mdesc{font-size:12px;color:var(--sub);line-height:1.6}
.mode .mrec{margin-left:auto;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.note{font-size:12px;color:var(--sub);line-height:1.9;margin:0;border-top:1px dashed var(--line);padding-top:16px}

/* ---------- play ---------- */
#play{justify-content:center}
.dots{display:flex;gap:6px;justify-content:center;padding:14px 0 4px}
.dot{width:9px;height:9px;border:1px solid var(--line);background:#fff;border-radius:50%}
.dot.cur{border-color:var(--ink);box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 9px var(--accent-w)}
.stage{flex:1;min-height:300px;display:flex;align-items:center;justify-content:center;gap:14px;
  padding:26px 6px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ew-resize;min-height:0}
.panel{margin:0;position:relative}
.panel svg{display:block;width:clamp(132px,41vw,290px);height:auto;background:#fff;border:1px solid var(--line)}
.panel.you svg{border-color:var(--ink)}
.panel figcaption{position:absolute;top:6px;left:8px;font-size:10px;letter-spacing:.18em;color:var(--sub)}
.panel.you figcaption{color:var(--accent)}
.hint{position:absolute;inset:auto 0 8px;text-align:center;font-size:11px;color:var(--sub);pointer-events:none;
  animation:blink 2.2s ease-in-out infinite}
#svgRef>*{transition:opacity .3s ease}
.panel.hid #svgRef>*{opacity:0}
.gone{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;letter-spacing:.22em;color:var(--gray);pointer-events:none;
  opacity:0;transition:opacity .35s ease .15s}
.panel.hid .gone{opacity:1}
.panel.you.locked svg{border-color:var(--accent);border-width:2px}
.panel.you.locked .hint{color:var(--accent);font-weight:700;letter-spacing:.2em;animation:none;opacity:1}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.primary{width:100%;max-width:420px;margin:0 auto;padding:16px;font:inherit;font-size:15px;font-weight:700;letter-spacing:.2em;
  background:var(--ink);color:var(--paper);border:0;border-radius:3px;cursor:pointer}
.primary:active{opacity:.85}
.quit{display:block;margin:14px auto 0;padding:8px 14px;background:none;border:0;font:inherit;
  font-size:12px;color:var(--sub);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.quit:hover{color:var(--ink)}

/* ---------- judge ---------- */
#judge{justify-content:center;align-items:center;gap:4px;position:relative}
#svgJudge{width:min(72vw,300px);height:auto;margin-top:8px}
.jline{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.jscore{font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.jgrade{font-size:20px;font-weight:400;color:var(--sub)}
.jerr{font-size:13px;color:var(--sub)}
.jsub{font-size:11px;color:var(--sub);letter-spacing:.1em;margin-bottom:14px}
#judge .primary{margin-top:auto}
.stamp{position:absolute;top:2px;right:6px;width:104px;height:104px;border:3px double var(--accent);
  border-radius:50%;color:var(--accent);display:flex;align-items:center;justify-content:center;
  font-size:21px;font-weight:800;letter-spacing:.08em;transform:rotate(-13deg) scale(.4);opacity:0;
  animation:stamp .45s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp{to{transform:rotate(-13deg) scale(1);opacity:1}}

/* ---------- result ---------- */
#result{flex:0 0 auto;gap:14px;padding-top:12px}
#cert svg{display:block;width:100%;height:auto;border:1px solid var(--line)}
.acts{max-width:520px;margin:0 auto;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts button{padding:13px 8px;font:inherit;font-size:13px;font-weight:700;letter-spacing:.08em;
  background:#fff;border:1px solid var(--ink);color:var(--ink);border-radius:3px;cursor:pointer}
.acts button.sub{border-color:var(--line);color:var(--sub);font-weight:400}
#statsWrap{position:fixed;inset:0;background:rgba(27,26,23,.5);display:flex;align-items:center;
  justify-content:center;padding:18px;z-index:50}
#statsWrap>div{width:100%;max-width:520px}
#statsCard{background:var(--paper);border:2px solid var(--ink);width:100%;
  max-height:80vh;overflow:auto;padding:24px 22px}
#statsCard h2{margin:0;font-size:14px;letter-spacing:.26em;font-weight:700}
#statsCard .srule{border-top:1px solid var(--ink);margin:10px 0 20px}
.slabel{font-size:11px;letter-spacing:.2em;color:var(--sub)}
.stotal{font-size:46px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.stable{width:100%;border-collapse:collapse;margin-top:22px;font-variant-numeric:tabular-nums}
.stable th{font-size:10px;letter-spacing:.12em;color:var(--sub);font-weight:400;text-align:right;padding:0 0 8px 12px}
.stable th:first-child{text-align:left;padding-left:0}
.stable td{border-top:1px solid var(--line);padding:10px 0 10px 12px;font-size:14px;text-align:right;color:var(--sub);white-space:nowrap}
.stable td:first-child{text-align:left;padding-left:0;font-size:15px;font-weight:700;color:var(--ink)}
.stable td:nth-child(2){color:var(--ink)}
.stable td.first{color:var(--accent);font-weight:700}
.snote{margin:20px 0 0;font-size:11px;color:var(--sub);line-height:1.9}
#statsClose{display:block;margin:18px auto 0;padding:10px 26px;font:inherit;font-size:13px;
  background:var(--ink);color:var(--paper);border:0;border-radius:3px;cursor:pointer}
footer{margin-top:24px;font-size:11px;color:var(--sub);line-height:1.9;border-top:1px dashed var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" id="brand"></div>
    <div class="meta"><span class="chip" id="modeChip" hidden></span><span id="bestChip"></span></div>
    <button id="langBtn">EN</button>
  </header>

  <section id="menu">
    <p class="tag" id="tagline"></p>
    <ul class="modes" id="modeList"></ul>
    <p class="note" id="howto"></p>
  </section>

  <section id="play" hidden>
    <div class="dots" id="dots"></div>
    <div class="stage" id="stage">
      <figure class="panel"><svg id="svgRef" viewBox="0 0 200 200"></svg><figcaption id="capRef"></figcaption><div class="gone" id="goneLabel"></div></figure>
      <figure class="panel you"><svg id="svgYou" viewBox="0 0 200 200"></svg><figcaption id="capYou"></figcaption>
        <div class="hint" id="hint"></div></figure>
    </div>
    <button id="decide" class="primary"></button>
    <button id="quitPlay" class="quit"></button>
  </section>

  <section id="judge" hidden>
    <div id="stampWrap"></div>
    <svg id="svgJudge" viewBox="0 0 200 200"></svg>
    <div class="jline"><span class="jscore" id="jScore"></span><span class="jgrade" id="jGrade"></span></div>
    <div class="jsub"><span class="jerr" id="jErr"></span></div>
    <button id="next" class="primary"></button>
    <button id="quitJudge" class="quit"></button>
  </section>

  <section id="result" hidden>
    <div id="cert"></div>
    <div class="acts">
      <button id="savePng"></button>
      <button id="tweet"></button>
      <button id="again" class="sub"></button>
      <button id="toMenu" class="sub"></button>
    </div>
  </section>

  <div id="statsWrap" hidden>
    <div>
      <div id="statsCard"></div>
      <button id="statsClose"></button>
    </div>
  </div>

  <footer id="foot"></footer>
</div>

function ping(a, m, s){
  try{
    const body = new URLSearchParams({ a });
    if(m != null) body.set('m', m);
    if(s != null) body.set('s', String(s));

  }catch(_){}

/* ---------- 図形 ---------- */
const SHAPES = ['circle','square','triangle','hexagon','rhombus','cross','star'];

function unitPoints(id){
  const P = [], T = Math.PI*2;
  if(id==='square')   for(let i=0;i<4;i++) P.push(polar(1, -Math.PI/4 + T*i/4));
  if(id==='triangle') for(let i=0;i<3;i++) P.push(polar(1, -Math.PI/2 + T*i/3));
  if(id==='hexagon')  for(let i=0;i<6;i++) P.push(polar(1, -Math.PI/2 + T*i/6));
  if(id==='rhombus')  { P.push([1,0],[0,.5],[-1,0],[0,-.5]); }
  if(id==='star')     for(let i=0;i<10;i++) P.push(polar(i%2?0.382:1, -Math.PI/2 + T*i/10));
  if(id==='cross'){
    const a = 1/Math.sqrt(1.09), b = 0.3*a;
    P.push([a,b],[b,b],[b,a],[-b,a],[-b,b],[-a,b],[-a,-b],[-b,-b],[-b,-a],[b,-a],[b,-b],[a,-b]);
  }
  return P;
}
function polar(r,t){ return [r*Math.cos(t), r*Math.sin(t)]; }
function shoelace(P){ let s=0; for(let i=0;i<P.length;i++){ const q=P[(i+1)%P.length]; s += P[i][0]*q[1]-q[0]*P[i][1]; } return Math.abs(s)/2; }

/* K[id] = 外接半径1のときの面積 */
const K = {};
SHAPES.forEach(id => { K[id] = id==='circle' ? Math.PI : shoelace(unitPoints(id)); });

const areaOf   = (id,R) => K[id]*R*R;
const radiusFor= (id,A) => Math.sqrt(A/K[id]);

function pathFor(id,R,rot,cx,cy){
  if(id==='circle') return null;
  const c=Math.cos(rot), s=Math.sin(rot);
  return unitPoints(id).map(([x,y],i)=>{
    const X=(x*c-y*s)*R+cx, Y=(x*s+y*c)*R+cy;
    return (i?'L':'M')+X.toFixed(2)+' '+Y.toFixed(2);
  }).join('')+'Z';
}
function shapeSVG(id,R,rot,cx,cy,attrs){
  return id==='circle'
    ? '<circle cx="'+cx+'" cy="'+cy+'" r="'+R.toFixed(2)+'" '+attrs+'/>'
    : '<path d="'+pathFor(id,R,rot,cx,cy)+'" '+attrs+'/>';
}

  {id:'tenohira',  min:0.70},
  {id:'donburi',   min:0.65},
  {id:'kan',       min:0}
];
const gradeOfTotal = (total,max) => GRADES.find(g => total/max >= g.min);
const gradeLabel = id => id==='kan' ? t(id) : t('gradeFmt').replace('{g}', t(id));
const GCOL = {nogisu:'#c8452e',monosashi:'#1b1a17',mebakari:'#4a463d',tenohira:'#7b7466',donburi:'#a49c8b',kan:'#c0b8a5'};
const dotColor = sc => sc>=100?'#c8452e': sc>=90?'#1b1a17': sc>=80?'#4a463d': sc>=70?'#7b7466': sc>=65?'#a49c8b':'#c0b8a5';

function fmtElapsed(ms){
  const s=Math.max(0,Math.round(ms/1000)), m=Math.floor(s/60), r=s%60;
  return lang==='ja' ? (m? m+'分'+r+'秒' : r+'秒') : (m? m+'m'+r+'s' : r+'s');
}

/* ---------- 乱数 ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function todayKey(){ const d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }

/* ---------- 出題 ---------- */
function makeQuestion(rng, pool, tgt, ref){
  const lo=Math.max(RMIN*RMIN*K[ref], RMIN*RMIN*K[tgt]);
  const hi=Math.min(RMAX*RMAX*K[ref], RMAX*RMAX*K[tgt]);
  const A =Math.exp(Math.log(lo)+rng()*(Math.log(hi)-Math.log(lo)));
  return { ref, tgt, area:A,
           refR:radiusFor(ref,A), ansR:radiusFor(tgt,A),
           refRot:rng()*Math.PI*2, tgtRot:rng()*Math.PI*2,
           startR:38+rng()*20 };
}

/* きじゅんも重複なしで割り当てる（自分自身とは組ませない） */
function pickRefs(rng, pool, tgts){
  for(let attempt=0; attempt<80; attempt++){
    const bag = pool.slice();
    for(let i=bag.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const x=bag[i]; bag[i]=bag[j]; bag[j]=x; }
    const out=[]; let ok=true;
    for(const tg of tgts){
      const k = bag.findIndex(x => x !== tg);
      if(k<0){ ok=false; break; }
      out.push(bag.splice(k,1)[0]);
    }
    if(ok && out.length===tgts.length) return out;
  }
  return tgts.map(tg => pool.find(x => x !== tg));   /* 保険 */
}

/* 1セットぶんの対象図形を、重複なしで選ぶ */
function pickTargets(rng, pool, n){
  const sh = pool.slice();
  for(let i=sh.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const x=sh[i]; sh[i]=sh[j]; sh[j]=x; }
  const out=[];
  while(out.length<n) out.push(...sh.slice(0, Math.min(n-out.length, sh.length)));
  return out;
}

const MODES = {
  tameshi :{ n:2, pool:['circle','square'] },
  narabe  :{ n:5, pool:SHAPES },
  hitofude:{ n:5, pool:SHAPES, oneShot:true },   /* 一度はなすと確定 */

  kyou    :{ n:5, pool:SHAPES, daily:true }
};
const S = { mode:null, qs:[], i:0, R:0, results:[], official:false, dragged:false, locked:false, blindT:0, blindT2:0, t0:0, t1:0 };
const $ = id => document.getElementById(id);

/* ---------- menu ---------- */
function bestKey(m){ return 'mebakari.best.'+m; }
function dailyKey(){ return 'mebakari.daily.'+todayKey(); }

function renderMenu(){
  document.title = t('title');
  $('tagline').innerHTML = t('tagline');
  $('howto').innerHTML = t('howto');
  $('foot').innerHTML = t('foot');
  $('langBtn').textContent = lang==='ja' ? 'EN' : '日本語';

  $('modeChip').hidden = true; $('bestChip').textContent='';
  $('modeList').innerHTML = Object.keys(MODES).map(m=>{

    if(m==='kyou'){
      const d=localStorage.getItem(dailyKey());
      if(d) rec = t('record')+' '+JSON.parse(d).score+t('pt');
    }else{
      const b=localStorage.getItem(bestKey(m));

  }).join('');

}

/* ---------- flow ---------- */
function show(id){ ['menu','play','judge','result'].forEach(s=>$(s).hidden = s!==id); }

function start(mode){
  S.mode = mode;
  const cfg = MODES[mode];
  const rng = cfg.daily ? mulberry32(parseInt(todayKey(),10)) : mulberry32(Math.floor(Math.random()*2**31));
  const tgts = pickTargets(rng, cfg.pool, cfg.n);
  const refs = pickRefs(rng, cfg.pool, tgts);
  S.qs = tgts.map((tg,i) => makeQuestion(rng, cfg.pool, tg, refs[i]));
  S.i = 0; S.results = []; S.t0 = Date.now(); S.t1 = 0;
  S.official = cfg.daily ? !localStorage.getItem(dailyKey()) : true;
  $('modeChip').hidden = false;
  $('modeChip').textContent = t(mode) + (cfg.daily && !S.official ? ' · '+t('practice') : '');
  $('capRef').textContent = t('ref'); $('capYou').textContent = t('you');
  $('decide').textContent = t('decide');
  $('quitPlay').textContent = t('toMenu');
  $('quitJudge').textContent = t('toMenu');
  ping('start', mode);
  loadQuestion();
  show('play');
}

/* ひとふで: 指をはなした時点で動かせなくする */
function lockYou(){
  S.locked = true;
  $('svgYou').parentElement.classList.add('locked');
  $('hint').textContent = t('locked');
  $('hint').hidden = false;
}
const baseHint = () => (MODES[S.mode] && MODES[S.mode].oneShot) ? t('hintOnce') : t('hint');

function loadQuestion(){
  const q = S.qs[S.i];
  S.R = q.startR; S.dragged=false;
  S.locked = false;
  $('svgYou').parentElement.classList.remove('locked');
  $('hint').textContent = baseHint();
  $('hint').hidden = MODES[S.mode].oneShot ? false : !!localStorage.getItem('mebakari.hinted');
  $('svgRef').innerHTML = shapeSVG(q.ref, q.refR, q.refRot, 100,100, 'fill="#bcb7a8"');
  /* うろおぼえ: 一定時間で「きじゅん」を消す */
  clearTimeout(S.blindT); clearTimeout(S.blindT2);
  const refPanel = $('svgRef').parentElement;
  refPanel.classList.remove('hid');
  $('goneLabel').textContent = t('gone');
  const blind = MODES[S.mode].blind;
  if(blind) S.blindT = setTimeout(()=>{
    refPanel.classList.add('hid');
    /* フェードが終わったらDOMからも消す。透明にするだけだと座標を読めてしまう */
    S.blindT2 = setTimeout(()=>{ $('svgRef').innerHTML = ''; }, 450);
  }, blind);
  drawYou();
  renderDots();
  const b = S.mode==='kyou' ? null : localStorage.getItem(bestKey(S.mode));
  $('bestChip').textContent = b ? t('best')+' '+b+t('pt') : '';
}
function drawYou(){
  const q = S.qs[S.i];
  $('svgYou').innerHTML = shapeSVG(q.tgt, S.R, q.tgtRot, 100,100, 'fill="#1b1a17"');
}
function renderDots(){
  $('dots').innerHTML = S.qs.map((_,i)=>{
    const r = S.results[i];
    if(r) return '<span class="dot" style="background:'+dotColor(r.score)+';border-color:'+dotColor(r.score)+'"></span>';
    return '<span class="dot'+(i===S.i?' cur':'')+'"></span>';
  }).join('');
}

/* ---------- ドラッグ（スライダーなし） ---------- */
(function(){
  const stage = $('stage');
  let d0=0, R0=0, active=false, moved=false, sx=0, sy=0;
  const centerOf = () => { const r=$('svgYou').getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2, s:200/r.width}; };
  const dist = (e,c) => Math.hypot(e.clientX-c.x, e.clientY-c.y)*c.s;

  stage.addEventListener('pointerdown', e=>{
    if($('play').hidden || S.locked) return;
    e.preventDefault();
    const c = centerOf();
    d0 = Math.max(26, dist(e,c)); R0 = S.R; active=true;
    moved=false; sx=e.clientX; sy=e.clientY;
    stage.setPointerCapture(e.pointerId);
    if(!S.dragged){ S.dragged=true; $('hint').hidden=true; localStorage.setItem('mebakari.hinted','1'); }
  });
  stage.addEventListener('pointermove', e=>{
    if(!active) return;
    if(Math.hypot(e.clientX-sx, e.clientY-sy) > 4) moved=true;
    const c = centerOf();
    S.R = Math.min(RHI, Math.max(RLO, R0 * dist(e,c)/d0));
    drawYou();
  });
  const end = e=>{
    if(!active) return;
    active=false;
    try{ stage.releasePointerCapture(e.pointerId); }catch(_){}
    /* ひとふで: 実際に動かしたうえで指をはなしたら、そこで確定 */
    if(MODES[S.mode] && MODES[S.mode].oneShot && moved) lockYou();
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);

  stage.addEventListener('wheel', e=>{
    if($('play').hidden || S.locked) return;
    e.preventDefault();
    const f = e.shiftKey ? 1.0005 : 1.002;           /* 面積で 0.05% / 0.2% */
    S.R = Math.min(RHI, Math.max(RLO, S.R * Math.sqrt(e.deltaY<0 ? f : 1/f)));
    drawYou();
  }, {passive:false});

  addEventListener('keydown', e=>{
    if(!$('play').hidden){
      if((e.key==='ArrowUp'||e.key==='ArrowDown') && !S.locked){
        e.preventDefault();
        const f = e.shiftKey ? 1.002 : 1.0005;
        S.R = Math.min(RHI, Math.max(RLO, S.R * Math.sqrt(e.key==='ArrowUp'?f:1/f)));
        drawYou();
      }
      if(e.key==='Enter') judge();
    }else if(!$('judge').hidden && e.key==='Enter'){ nextQ(); }
  });
})();

/* ---------- 判定 ---------- */
function judge(){
  const q = S.qs[S.i];
  const mine = areaOf(q.tgt, S.R);
  const se = (mine - q.area)/q.area;          /* 符号つき誤差 */
  const e  = Math.abs(se);
  const sc = scoreOf(e);
  S.results.push({ tgt:q.tgt, ref:q.ref, se, e, score:sc, R:S.R, ansR:q.ansR, rot:q.tgtRot, refR:q.refR, refRot:q.refRot });

  $('stampWrap').innerHTML = sc===100 ? '<div class="stamp">'+t('perfect')+'</div>' : '';
  $('svgJudge').innerHTML =
    shapeSVG(q.tgt, S.R, q.tgtRot, 100,100, 'fill="#1b1a17"') +
    shapeSVG(q.tgt, q.ansR, q.tgtRot, 100,100, 'fill="none" stroke="#fbfaf7" stroke-width="4.5"') +
    shapeSVG(q.tgt, q.ansR, q.tgtRot, 100,100, 'fill="none" stroke="#c8452e" stroke-width="1.6" stroke-dasharray="5 4"');
  $('jScore').textContent = sc;
  $('jGrade').textContent = t('pt');
  $('jGrade').style.color = '#6d6759';
  $('jErr').textContent = (se>0?'+':'−') + (e*100).toFixed(1) + '%　/　' + t('ghostNote');
  $('next').textContent = (S.i === S.qs.length-1) ? t('seeResult') : t('next');
  show('judge');
}
function nextQ(){
  if(S.i === S.qs.length-1){ finish(); return; }
  S.i++; loadQuestion(); show('play');
}
function finish(){
  S.t1 = Date.now();
  const total = S.results.reduce((a,r)=>a+r.score,0);
  if(S.mode==='kyou'){
    if(S.official) localStorage.setItem(dailyKey(), JSON.stringify({score:total}));
  }else{
    const b = +(localStorage.getItem(bestKey(S.mode))||0);
    if(total>b) localStorage.setItem(bestKey(S.mode), total);
  }
  ping('done', S.mode, total);
  $('cert').innerHTML = certSVG(total);
  $('savePng').textContent=t('savePng'); $('tweet').textContent=t('tweet');
  $('again').textContent=t('again');    $('toMenu').textContent=t('toMenu');
  show('result');
}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const F = 'system-ui,-apple-system,\'Hiragino Sans\',\'Noto Sans JP\',sans-serif';

function certSVG(total){
  const n = S.results.length, W=1000, H=1000, max=n*100;
  const AC = n<=2 ? 15000 : 5200;                    /* 正解の描画面積を全問そろえる */
  const ink='#1b1a17', sub='#6d6759', faint='#9b9486', acc='#c8452e', paper='#fbfaf7', gray='#bcb7a8';
  const g = gradeOfTotal(total, max);
  let s = '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" font-family="'+F+'">';
  s += '<rect width="'+W+'" height="'+H+'" fill="'+paper+'"/>';
  for(let x=0;x<=W;x+=25) s+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+H+'" stroke="'+(x%125?'#f0ece1':'#e5e0d2')+'"/>';
  for(let y=0;y<=H;y+=25) s+='<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="'+(y%125?'#f0ece1':'#e5e0d2')+'"/>';
  s += '<rect x="40" y="40" width="920" height="920" fill="none" stroke="'+ink+'" stroke-width="2"/>';

  /* --- 見出し --- */
  s += '<image href="'+LOGO+'" xlink:href="'+LOGO+'" x="79" y="88" width="197" height="54"/>';
  s += '<text x="920" y="122" font-size="22" font-weight="700" letter-spacing="8" text-anchor="end" fill="'+ink+'">'+esc(t('mitate'))+'</text>';
  s += '<line x1="80" y1="150" x2="920" y2="150" stroke="'+ink+'"/>';

  const d = new Date(S.t1 || Date.now());
  const p2 = v => String(v).padStart(2,'0');
  const stamp = d.getFullYear()+'.'+p2(d.getMonth()+1)+'.'+p2(d.getDate())+'  '+p2(d.getHours())+':'+p2(d.getMinutes());
  s += '<text x="80" y="186" font-size="17" letter-spacing="4" fill="'+sub+'">'+esc(t(S.mode))+
       (S.mode==='kyou'&&!S.official?' · '+esc(t('practice')):'')+'</text>';
  s += '<text x="920" y="186" font-size="17" letter-spacing="1" text-anchor="end" fill="'+sub+'">'+
       stamp+'　'+esc(t('took'))+' '+esc(fmtElapsed(S.t1-S.t0))+'</text>';

  /* --- きじゅん（比べ元）。正解と同じ面積なので、全問そろえて描ける --- */
  const cw = 840/n;
  s += '<text x="80" y="240" font-size="15" letter-spacing="4" fill="'+sub+'">'+esc(t('ref'))+'</text>';
  S.results.forEach((r,i)=>{
    const cx = 80 + cw*(i+0.5);
    s += shapeSVG(r.ref, radiusFor(r.ref,AC), r.refRot, cx, 322, 'fill="'+gray+'"');
  });

  /* --- あなた（点線＝正しい大きさ） --- */
  s += '<text x="80" y="444" font-size="15" letter-spacing="4" fill="'+acc+'">'+esc(t('you'))+
       '<tspan fill="'+faint+'" letter-spacing="0">　'+esc(t('ghostNote'))+'</tspan></text>';
  S.results.forEach((r,i)=>{
    const cx = 80 + cw*(i+0.5), cy = 526;
    const gR = radiusFor(r.tgt, AC);
    const yR = Math.min(cw/2-10, gR*Math.sqrt(Math.max(0.16, 1+r.se)));
    s += shapeSVG(r.tgt, yR, r.rot, cx, cy, 'fill="'+ink+'"');
    s += shapeSVG(r.tgt, gR, r.rot, cx, cy, 'fill="none" stroke="'+paper+'" stroke-width="6"');
    s += shapeSVG(r.tgt, gR, r.rot, cx, cy, 'fill="none" stroke="'+acc+'" stroke-width="2" stroke-dasharray="8 6"');
    s += '<text x="'+cx+'" y="666" font-size="25" font-weight="700" text-anchor="middle" fill="'+ink+'">'+
         (r.se>0?'+':'−')+(r.e*100).toFixed(1)+'%</text>';
    s += '<text x="'+cx+'" y="694" font-size="16" text-anchor="middle" fill="'+sub+'">'+r.score+esc(t('pt'))+'</text>';
  });
  s += '<line x1="80" y1="736" x2="920" y2="736" stroke="#ded9cb"/>';

  /* --- 合計とグレード --- */
  const avgE = S.results.reduce((a,r)=>a+r.e,0)/n;
  s += '<text x="80" y="792" font-size="14" letter-spacing="5" fill="'+sub+'">'+esc(t('total'))+'</text>';
  s += '<text x="80" y="868" font-size="66" font-weight="800" fill="'+ink+'">'+total+
       '<tspan font-size="27" font-weight="400" fill="'+faint+'">'+esc(t('pt'))+' / '+max+esc(t('pt'))+'</tspan>'+
       '<tspan font-size="25" font-weight="400" fill="'+sub+'">　'+esc(t('avg'))+' '+(avgE*100).toFixed(1)+'%</tspan></text>';
  s += '<text x="920" y="866" font-size="46" font-weight="800" letter-spacing="3" text-anchor="end" fill="'+GCOL[g.id]+'">'+
       esc(gradeLabel(g.id))+'</text>';
  return s+'</svg>';
}

  $('statsClose').textContent = t('close');
  card.innerHTML = '<h2>'+esc(t('statsTitle'))+'</h2><div class="srule"></div><p class="snote">…</p>';
  wrap.hidden = false;
  let d = null;
  try{ const r = await fetch(STATS_URL, {cache:'no-store'}); if(r.ok) d = await r.json(); }catch(_){}
  if(!d || typeof d.total !== 'number'){
    card.innerHTML = '<h2>'+esc(t('statsTitle'))+'</h2><div class="srule"></div>'+
                     '<p class="snote">'+esc(t('statsErr'))+'</p>';
    return;
  }
  const rows = Object.keys(MODES).map(m=>{
    const x = (d.modes && d.modes[m]) || { plays:0, top:[] };
    const top = (x.top || []);
    const cell = i => top[i] != null ? top[i] + t('pt') : '—';
    return '<tr><td>'+esc(t(m))+'</td><td>'+(x.plays|0)+'</td>'+
           '<td class="first">'+cell(0)+'</td><td>'+cell(1)+'</td><td>'+cell(2)+'</td></tr>';
  }).join('');
  card.innerHTML =
    '<h2>'+esc(t('statsTitle'))+'</h2><div class="srule"></div>'+
    '<div class="slabel">'+esc(t('statsTotal'))+'</div>'+
    '<div class="stotal">'+(d.total|0)+'</div>'+
    '<table class="stable"><tr><th>'+esc(t('statsMode'))+'</th><th>'+esc(t('statsPlays'))+'</th>'+
    '<th>1</th><th>2</th><th>3</th></tr>'+rows+'</table>'+
    '<p class="snote">'+t('statsNote')+'</p>';
}
$('statsClose').onclick = ()=>{ $('statsWrap').hidden = true; };
$('statsWrap').onclick  = e =>{ if(e.target === $('statsWrap')) $('statsWrap').hidden = true; };

/* ---------- 共有 ---------- */
function certPNG(){
  return new Promise((res,rej)=>{
    const svg = certSVG(S.results.reduce((a,r)=>a+r.score,0));
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas'); c.width=2000; c.height=2000;
      const g = c.getContext('2d'); g.fillStyle='#fbfaf7'; g.fillRect(0,0,2000,2000);
      g.drawImage(img,0,0,2000,2000);
      c.toBlob(b=> b?res(b):rej(new Error('toBlob')), 'image/png');
    };
    img.onerror = rej;
    img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
/* みたてに印字した日時と同じものをファイル名にする */
function shotName(){
  const d = new Date(S.t1 || Date.now()), p = v => String(v).padStart(2,'0');
  return 'mebakari_' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate())
       + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '.png';
}
$('savePng').onclick = async ()=>{
  try{
    const blob = await certPNG();
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = shotName();          /* 共有シートを出さず、そのまま保存させる */
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(err){ alert('保存できませんでした: '+err.message); }
};
$('tweet').onclick = ()=>{
  const total = S.results.reduce((a,r)=>a+r.score,0), max = S.results.length*100;
  const g = gradeOfTotal(total, max);
  /* 「今日の5もん」だけは『モード』を付けない */
  const mname = t(S.mode) + (S.mode==='kyou' ? '' : t('modeSuffix'));
  const text = t('shareText').replace('{m}',mname).replace('{s}',total).replace('{x}',max)
                 .replace('{g}', gradeLabel(g.id))
                 .replace('{u}', SITE_URL);
  /* 末尾にポストのURLを置くと、Xの投稿画面で引用として扱われる */
  const full = QUOTE_URL ? text + '\n' + QUOTE_URL : text;
  open('https://x.com/intent/post?text='+encodeURIComponent(full),'_blank','noopener');
};
function toMenu(){ clearTimeout(S.blindT); clearTimeout(S.blindT2); renderMenu(); show('menu'); }
$('brand').onclick     = toMenu;
$('quitPlay').onclick  = toMenu;
$('quitJudge').onclick = toMenu;
$('again').onclick  = ()=> start(S.mode);
$('toMenu').onclick = toMenu;
$('decide').onclick = judge;
$('next').onclick   = nextQ;
let langHits = 0, langTimer = 0;
$('langBtn').onclick= ()=>{
  /* 素早く8回押すと「きろく」が開く。8は偶数なので言語は元に戻る */
  langHits++;
  clearTimeout(langTimer);
  langTimer = setTimeout(()=>{ langHits = 0; }, 1500);
  const openStats = langHits >= 8;
  if(openStats) langHits = 0;
  lang = lang==='ja' ? 'en':'ja';
  localStorage.setItem('mebakari.lang', lang);
  renderMenu();
  if(!$('result').hidden){ $('cert').innerHTML = certSVG(S.results.reduce((a,r)=>a+r.score,0));
    $('savePng').textContent=t('savePng'); $('tweet').textContent=t('tweet');
    $('again').textContent=t('again'); $('toMenu').textContent=t('toMenu'); }
  if(!$('play').hidden){ $('capRef').textContent=t('ref'); $('capYou').textContent=t('you');
    $('decide').textContent=t('decide'); $('hint').textContent = S.locked ? t('locked') : baseHint();
    $('quitPlay').textContent=t('toMenu'); $('quitJudge').textContent=t('toMenu');
    $('modeChip').textContent=t(S.mode); }
  if(openStats) showStats();          /* 言語を切り替えたあとに開く */
};

renderMenu(); show('menu');
ping('hit');          /* ページを開いた回数＝挑戦者総数 */

})();
</script>
