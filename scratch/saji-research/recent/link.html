<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15191c">
  <title>LINK｜WEB謎</title>
  <link rel="stylesheet" href="styles.css?v=20261004-ui3">
  <script src="analytics.js" defer></script>
  <script src="audio.js" defer></script>
  <script src="app.js?v=20261004-ui3" defer></script>
</head>
<body>
  <main class="page">
    <header class="header"><h1 id="game-title">L<span class="title-lamp">I</span>NK</h1><button id="settings-open" class="icon-button" aria-label="設定" type="button">⚙</button></header>
    <section class="play" aria-label="ライトの操作盤">
      <nav id="stage-nav" class="stage-nav" aria-label="箱を選ぶ"></nav>
      <div id="board" class="board"></div>
      <div class="confirmation"><button id="confirm" class="outline-button" aria-label="点灯確認" type="button" hidden></button></div>
      <p id="notice" class="notice" role="status" aria-live="polite">接続しています。</p>
      <button id="reconnect" class="text-button" type="button" hidden>再接続</button>
      <div class="actions"><button id="undo" class="text-button" type="button" disabled>一つ戻す</button><button id="reset" class="text-button" type="button" disabled>はじめから</button></div>
      <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
    </section>
  </main>
  <dialog id="clear-dialog" aria-labelledby="clear-title"><h2 id="clear-title"></h2><button id="next" class="solid-button" type="button">次へ</button></dialog>
  <dialog id="finish-dialog" aria-labelledby="finish-title"><button class="close" data-close="finish-dialog" aria-label="閉じる" type="button">×</button><h2 id="finish-title"></h2><a id="share" class="solid-button" target="_blank" rel="noopener noreferrer" hidden>Xでシェア</a></dialog>
  <dialog id="settings-dialog" class="settings" aria-labelledby="settings-title">
    <button class="close" data-close="settings-dialog" aria-label="閉じる" type="button">×</button><h2 id="settings-title">設定</h2>
    <div class="volume-heading"><label for="volume">効果音の音量</label><output id="volume-value" for="volume">65%</output></div>
    <input id="volume" type="range" min="0" max="100" value="65">
    <button id="mute" class="outline-button" type="button" aria-pressed="false">無音</button>
    <div class="setting-links"><a href="https://sajiqook.jp/game/" target="_blank" rel="noopener noreferrer">他のゲーム</a><div class="hint-link"><a href="https://note.com/saji_q/n/ndf67bfc443b6" aria-describedby="hint-note" target="_blank" rel="noopener noreferrer">ヒントと解説</a><p id="hint-note" class="small-note">すべてのWEB謎のヒントと解説を、この有料記事ひとつで楽しめます。</p></div></div>
    <p class="disclaimer">この画面の設定、内容は謎解きとは関係ありません。</p>
  </dialog>
  <dialog id="records-dialog" aria-labelledby="records-title"><button class="close" data-close="records-dialog" aria-label="閉じる" type="button">×</button><h2 id="records-title">記録</h2><div id="records-content" role="status"></div><p class="disclaimer">この画面は謎解きと関係ありません。</p><button id="records-retry" class="text-button" hidden type="button">再読み込み</button></dialog>
  <dialog id="source-dialog" aria-labelledby="source-title"><button class="close" data-close="source-dialog" aria-label="閉じる" type="button">×</button><h2 id="source-title">やるんだな！？今…！ここで！</h2><p class="small-note">この表示は謎解きと関係ありません。</p></dialog>
  <noscript>このゲームにはJavaScriptが必要です。</noscript>
</body>
</html>
