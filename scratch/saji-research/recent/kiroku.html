<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#575249">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="あいつと作った、一冊のアルバム。">
  <title>記録</title>
  <link rel="canonical" href="https://sajiqook.jp/game/kiroku">
  <link rel="preload" href="assets/hand.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="layout.css?v=11">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='2' width='24' height='28' rx='2' fill='%234c5140'/%3E%3Cpath d='M11 11h13v10H11z' fill='%23d9c8a4'/%3E%3C/svg%3E">
  <script defer src="game.js?v=12"></script>
  <script defer src="analytics.js"></script>
</head>
<body>
  <div class="desk-grain" aria-hidden="true"></div>
  <main class="stage" id="stage">
    <header class="toolbar">
      <span class="toolbar-space"></span>
      <button class="restart-button" id="restart-button" aria-haspopup="dialog" aria-controls="restart-dialog">はじめから</button>
      <button class="settings-toggle" id="settings-toggle" aria-expanded="false" aria-controls="settings-panel">設定 <span aria-hidden="true">＋</span></button>
    </header>
    <section class="settings-panel" id="settings-panel" aria-label="設定" hidden inert>
      <div class="settings-links">
        <a href="https://sajiqook.jp/game/" target="_blank" rel="noopener noreferrer">他のゲーム ↗</a>
        <a href="https://note.com/saji_q/n/ndf67bfc443b6" target="_blank" rel="noopener noreferrer">ヒント・解説 ↗<small>すべてのWEB謎のヒントと解説を、この有料記事ひとつで楽しめます。</small></a>
      </div>
      <div class="sound-settings"><label for="volume">SE音量</label><input id="volume" type="range" min="0" max="100" value="65"><output id="volume-value" for="volume">65</output><button id="sound-button" type="button" aria-pressed="true">無音</button></div>
      <p class="settings-note">この画面は謎解きとは関係ありません。</p>
      <p class="settings-note" id="record-save-status" hidden>記録の保存に接続できていません。</p>
    </section>
    <div id="view-root" aria-live="off"></div>
    <div class="connection-status" id="connection-status" role="status"><p id="connection-message">アルバムを開いています……</p><button class="paper-button" id="retry-connection" hidden>接続し直す</button></div>
    <p class="sr-only" id="global-message" aria-live="polite"></p>
    <noscript>このアルバムを開くにはJavaScriptを有効にしてください。</noscript>
  </main>
  <dialog class="aux-dialog" id="restart-dialog" aria-labelledby="restart-heading">
    <h2 id="restart-heading">はじめからやり直す？</h2>
    <p>アルバムの進み具合がリセットされます。<br>音の設定と総合記録は消えません。</p>
    <div class="dialog-actions"><button class="paper-button" data-close="restart-dialog" autofocus>戻る</button><button class="paper-button" id="confirm-restart">はじめから</button></div>
  </dialog>
  <dialog class="aux-dialog" id="records-dialog" aria-labelledby="records-heading">
    <button class="dialog-close" data-close="records-dialog" aria-label="閉じる">×</button>
    <h2 id="records-heading">みんなの記録</h2>
    <p class="dialog-note">この画面は謎解きとは関係ありません。</p>
    <p id="records-status" role="status"></p><dl id="records-data" hidden></dl>
    <button class="paper-button" id="retry-records" hidden>再取得</button>
  </dialog>
  <dialog class="aux-dialog" id="source-notice" aria-labelledby="source-heading">
    <button class="dialog-close" data-close="source-notice" aria-label="閉じる">×</button>
    <h2 id="source-heading">アルバムの中で。</h2><p>物語の続きは、アルバムの中で探してください。</p>
  </dialog>
</body>
</html>
