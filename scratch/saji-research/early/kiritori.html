<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3ea">
  <title>お宝を見つけよう</title>
  <script src="../game-settings.js?v=202609222218" data-host=".game-actions" defer></script>
  <script src="../game-analytics.js" defer></script>
  <style>
    :root {
      color-scheme: light;
      --paper: #fffdf8;
      --ink: #26241f;
      --muted: #777166;
      --line: #cfc7b8;
      --accent: #a84332;
      --gold: #d7a72f;
      --shadow: rgba(49, 42, 30, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    body {
      min-height: 100svh;
      color: var(--ink);
      background: #f7f3ea;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", YuGothic, system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      color: inherit;
      font: inherit;
    }

    button,
    .letter-tile {
      touch-action: manipulation;
    }

    .game {
      width: min(900px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: clamp(16px, 3.5vh, 38px) clamp(14px, 4vw, 34px) clamp(14px, 3vh, 30px);
    }

    .game-header {
      margin-bottom: clamp(12px, 2.5vh, 24px);
      text-align: center;
    }

    .game-actions {
      display: flex;
      min-height: 42px;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 4px;
    }

    h1 {
      margin: 0;
      font-family: inherit;
      font-size: clamp(28px, 6vw, 43px);
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .lead {
      margin: 9px 0 0;
      color: #4e4a42;
      font-size: clamp(14px, 2.8vw, 17px);
      letter-spacing: 0.035em;
    }

    .workbench {
      position: relative;
      padding: clamp(70px, 10vw, 82px) clamp(18px, 4vw, 30px) clamp(20px, 4vw, 30px);
      border: 1px solid #d4ccbd;
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 0 8px 28px var(--shadow);
    }

    .cut-stage {
      display: grid;
      width: min(440px, 100%);
      margin: 0 auto;
      grid-template-columns: minmax(0, 1fr);
      gap: 2px;
      touch-action: auto;
    }

    .cut-stage.tool-active {
      touch-action: none;
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
    }

    .cut-target {
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 118px;
      place-items: center;
      padding: 8px;
      overflow: hidden;
      border: 0;
      background: transparent;
    }

    .object-view {
      display: grid;
      place-items: center;
      transition: opacity 210ms ease, transform 210ms ease;
    }

    .cut-target.is-cut .object-view {
      pointer-events: none;
      opacity: 0;
      transform: scale(0.96);
    }

    .board-shape {
      position: relative;
      display: grid;
      width: clamp(150px, 26vw, 210px);
      height: 82px;
      place-items: center;
    }

    .object-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .saw-groove {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 0;
      background: #563c29;
      transform: translate(-50%, -50%);
      transition: height 100ms ease;
    }

    .lettuce-shape {
      position: relative;
      width: clamp(96px, 15vw, 116px);
      height: 116px;
    }

    .cut-line {
      position: absolute;
      z-index: 3;
      top: 50%;
      left: 2%;
      width: 96%;
      height: 2px;
      opacity: 0;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(47, 77, 40, 0.6);
      transform: rotate(-13deg) scaleX(0);
      transform-origin: left center;
    }

    .cut-target.flash-cut .cut-line {
      animation: slash 260ms ease-out both;
    }

    .piece-bank {
      position: absolute;
      inset: 14px;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      gap: 8px;
      pointer-events: none;
    }

    .piece-bank.has-pieces {
      pointer-events: auto;
    }

    .toolbox {
      position: absolute;
      z-index: 30;
      top: 16px;
      right: 16px;
    }

    .tool-tab {
      min-width: 122px;
      min-height: 38px;
      padding: 7px 11px;
      border: 1px solid #8f877a;
      border-radius: 5px;
      background: #fff;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
      cursor: pointer;
    }

    .tool-tab::after {
      content: "▾";
      margin-left: 8px;
      color: #81796e;
    }

    .tool-tab[aria-expanded="true"]::after {
      content: "▴";
    }

    .tool-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      width: 176px;
      padding: 5px;
      border: 1px solid #aaa194;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(49, 42, 30, 0.2);
    }

    .tool-menu[hidden] {
      display: none;
    }

    .tool-choice {
      display: grid;
      width: 100%;
      min-height: 42px;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 7px;
      padding: 5px 8px;
      border: 0;
      border-radius: 3px;
      background: #fff;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }

    .tool-choice:hover,
    .tool-choice:focus-visible {
      background: #f2efe8;
      outline: none;
    }

    .tool-choice.is-selected {
      background: #e9e5dc;
    }

    .tool-choice.is-selected::after {
      content: "✓";
      font-weight: 700;
    }

    .tool-choice svg {
      width: 32px;
      height: 28px;
    }

    .none-mark {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      color: #817a70;
      font-size: 17px;
    }

    .wrong-source-zone {
      position: relative;
      z-index: 2;
      display: grid;
      width: min(390px, 100%);
      min-height: 46px;
      margin: 0 auto 1px;
      place-items: center;
    }

    .wrong-source {
      visibility: hidden;
      padding: 5px 8px;
      outline: none;
      color: #6f2923;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.12em;
      white-space: nowrap;
      user-select: text;
      -webkit-user-select: text;
    }

    .wrong-source.is-visible {
      visibility: visible;
    }

    .wrong-source.tool-locked,
    .wrong-source.is-exhausted {
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
    }

    .wrong-source.is-exhausted {
      pointer-events: none;
    }

    .wrong-pieces {
      position: absolute;
      z-index: 3;
      inset: 2px;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      gap: 6px;
      pointer-events: none;
    }

    .wrong-pieces.has-pieces {
      pointer-events: auto;
    }

    .answer-area {
      padding-top: clamp(4px, 1vw, 8px);
    }

    .answer-source-zone {
      position: relative;
      display: grid;
      width: min(270px, 100%);
      min-height: 64px;
      margin: 0 auto 6px;
      place-items: center;
    }

    .cut-source-wrap {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 92px;
      min-height: 62px;
    }

    .cut-source {
      position: relative;
      z-index: 1;
      display: inline-block;
      padding: 5px 7px;
      outline: none;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.12em;
      white-space: nowrap;
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
    }

    .cut-source:focus-visible {
      outline: none;
    }

    .cut-source.tool-locked {
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
    }

    .cut-source.is-exhausted {
      cursor: default;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .source-char {
      transition: opacity 130ms ease;
    }

    .source-char.is-cut {
      opacity: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    .source-pieces {
      position: absolute;
      z-index: 3;
      inset: 4px;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      gap: 6px;
      pointer-events: none;
    }

    .source-pieces.has-pieces {
      pointer-events: auto;
    }

    .answer-slots {
      display: grid;
      grid-template-columns: repeat(7, minmax(34px, 48px));
      justify-content: center;
      gap: clamp(5px, 1.5vw, 9px);
      margin-top: 0;
    }

    .answer-slots.is-six {
      grid-template-columns: repeat(6, minmax(34px, 48px));
    }

    .answer-slot[hidden] {
      display: none;
    }

    .answer-slot {
      display: grid;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid #aaa294;
      border-radius: 5px;
      background: #fff;
      box-shadow: inset 0 -2px 0 #ece6da;
    }

    .answer-slot.is-over {
      border-color: var(--accent);
      background: #fff4ef;
    }

    .letter-tile {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      place-items: center;
      padding: 0;
      border: 1px solid #565149;
      border-radius: 4px;
      color: #24211d;
      background: #fff;
      box-shadow: 0 2px 0 #c9c0b1;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      animation: piece-out 330ms cubic-bezier(.18, .83, .35, 1.22) both;
    }

    .answer-slot .letter-tile {
      width: 100%;
      height: 100%;
      border: 0;
      box-shadow: none;
      animation: slot-in 150ms ease both;
    }

    .answer-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }

    .action-button {
      display: inline-grid;
      place-items: center;
      min-width: 104px;
      min-height: 42px;
      padding: 8px 18px;
      border: 1px solid #554f46;
      border-radius: 5px;
      background: #fff;
      font-weight: 650;
      letter-spacing: 0.08em;
      cursor: pointer;
      text-decoration: none;
    }

    .action-button.primary {
      color: #fff;
      border-color: #34302a;
      background: #34302a;
    }

    .answer-area.wrong {
      animation: shake 310ms ease;
    }

    .modal {
      position: fixed;
      z-index: 200;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(35, 31, 25, 0.52);
    }

    .modal[hidden] {
      display: none;
    }

    .modal-card {
      width: min(390px, 100%);
      padding: 32px 24px 26px;
      border: 2px solid #5c503b;
      border-radius: 10px;
      background: #fffdf8;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .modal-card h2 {
      margin: 0;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 27px;
      letter-spacing: 0.08em;
    }

    .modal-card p {
      margin: 10px 0 22px;
      color: #625b50;
      font-size: 14px;
    }

    .stats-list {
      display: grid;
      gap: 10px;
      margin: 22px 0 8px;
    }

    .stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 10px 12px;
      border-bottom: 1px solid #d7d0c4;
    }

    .stats-row dt,
    .stats-row dd {
      margin: 0;
    }

    .stats-row dd {
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 19px;
      font-weight: 700;
    }

    .modal-card .stats-note {
      margin: 15px 0 18px;
      font-size: 12px;
    }

    @keyframes slash {
      0% { opacity: 0; transform: rotate(-13deg) scaleX(0); }
      35% { opacity: 1; }
      100% { opacity: 1; transform: rotate(-13deg) scaleX(1); }
    }

    @keyframes piece-out {
      from { opacity: 0; transform: translateY(10px) scale(0.76) rotate(8deg); }
      to { opacity: 1; transform: none; }
    }

    @keyframes slot-in {
      from { transform: scale(0.78); }
      to { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      55% { transform: translateX(5px); }
      78% { transform: translateX(-2px); }
    }

    @media (max-width: 600px) {
      .game {
        padding-top: 58px;
      }

      .workbench {
        border-radius: 8px;
        padding: 56px 12px 20px;
      }

      .cut-stage {
        grid-template-columns: minmax(0, 1fr);
      }

      .cut-target {
        min-height: 104px;
        padding: 4px 5px;
      }

      .wrong-source-zone {
        min-height: 40px;
      }

      .board-shape {
        width: clamp(140px, 44vw, 190px);
        height: 70px;
      }

      .lettuce-shape {
        width: 100px;
        height: 100px;
      }

      .piece-bank {
        inset: 8px 5px;
        gap: 5px;
      }

      .letter-tile {
        width: 34px;
        height: 34px;
        flex-basis: 34px;
        font-size: 16px;
      }

      .toolbox {
        top: 14px;
        right: 12px;
      }

      .answer-area {
        padding-inline: 12px;
      }

      .answer-source-zone {
        min-height: 56px;
        margin-bottom: 5px;
      }

      .answer-slots {
        grid-template-columns: repeat(7, minmax(0, 42px));
        gap: 5px;
      }

      .answer-slots.is-six {
        grid-template-columns: repeat(6, minmax(0, 42px));
      }
    }

    @media (max-height: 820px) {
      .game {
        display: flex;
        height: 100svh;
        min-height: 0;
        flex-direction: column;
        padding-top: 9px;
        padding-bottom: 9px;
      }

      .game-header {
        flex: 0 0 auto;
        margin-bottom: 7px;
      }

      h1 {
        font-size: clamp(24px, 4.5vh, 32px);
      }

      .lead {
        margin-top: 4px;
        font-size: 12px;
        line-height: 1.35;
      }

      .workbench {
        display: flex;
        min-height: 0;
        flex: 0 1 auto;
        flex-direction: column;
        padding-top: 48px;
        padding-bottom: 18px;
      }

      .wrong-source-zone {
        min-height: 36px;
        margin-top: 0;
      }

      .cut-stage {
        min-height: 0;
        flex: 0 1 auto;
        grid-template-rows: auto auto;
      }

      .cut-target {
        min-height: 0;
        padding: 3px 6px;
      }

      .board-shape {
        width: min(180px, 48vw);
        height: min(68px, 10vh);
      }

      .lettuce-shape {
        width: min(92px, 25vw);
        height: min(92px, 14vh);
      }

      .answer-source-zone {
        min-height: 50px;
        margin-bottom: 3px;
      }

      .cut-source-wrap {
        min-height: 46px;
      }

      .answer-actions {
        margin-top: 9px;
      }

      .action-button {
        min-height: 36px;
        padding-block: 5px;
      }
    }

    @media (max-width: 370px) {
      .cut-stage {
        gap: 8px;
      }

      .cut-target {
        min-height: 134px;
      }

      .board-shape {
        width: 136px;
      }

      .lettuce-shape {
        transform: scale(0.86);
      }

      .letter-tile {
        width: 30px;
        height: 30px;
        flex-basis: 30px;
        font-size: 14px;
      }
    }

    @media (max-width: 370px) and (max-height: 820px) {
      .cut-stage {
        gap: 2px;
      }

      .cut-target {
        min-height: 0;
      }

      .board-shape {
        width: min(150px, 46vw);
        height: min(60px, 10vh);
      }

      .lettuce-shape {
        width: min(82px, 24vw);
        height: min(82px, 13vh);
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="game">
    <header class="game-header">
      <div class="game-actions" aria-label="操作"></div>
      <h1 id="gameTitle">お宝を見つけよう</h1>
      <p class="lead">以下にあるものを、用途にあうツールを上手く使用してカットしよう！</p>
    </header>

    <section class="workbench" aria-label="カットする場所">
      <div class="toolbox">
        <button class="tool-tab" id="toolToggle" type="button" aria-expanded="false" aria-controls="toolMenu">TOOLS：のこぎり</button>
        <div class="tool-menu" id="toolMenu" role="menu" hidden>
          <button class="tool-choice" type="button" role="menuitemradio" aria-checked="false" data-tool="none">
            <span class="none-mark" aria-hidden="true">—</span><span>なし</span>
          </button>
          <button class="tool-choice is-selected" type="button" role="menuitemradio" aria-checked="true" data-tool="saw">
            <svg viewBox="0 0 64 46" aria-hidden="true">
              <path d="M24 8h34v13H24z" fill="#c8c9c6" stroke="#555" stroke-width="2"/>
              <path d="M25 21h33l-4 5-4-5-4 5-4-5-4 5-4-5-4 5-5-5z" fill="#c8c9c6" stroke="#555" stroke-width="1.5"/>
              <path d="M25 9L7 25c-4 4-2 12 4 13 4 1 7-1 9-5l7-12" fill="#a36b3e" stroke="#5e4029" stroke-width="2.5"/>
            </svg><span>のこぎり</span>
          </button>
          <button class="tool-choice" type="button" role="menuitemradio" aria-checked="false" data-tool="knife">
            <svg viewBox="0 0 64 46" aria-hidden="true">
              <path d="M25 9h34c-2 11-9 17-22 19H25z" fill="#d9dcdd" stroke="#555" stroke-width="2"/>
              <path d="M5 24c0-3 2-5 5-5h18v13H10c-3 0-5-2-5-5z" fill="#4d443c" stroke="#2f2a25" stroke-width="2"/>
            </svg><span>包丁</span>
          </button>
        </div>
      </div>

      <div class="wrong-source-zone">
        <span class="wrong-source tool-locked" id="wrongSource" contenteditable="false" spellcheck="false" aria-label="違うよ"><span class="source-char" data-source-char="wrong">違うよ</span></span>
        <div class="wrong-pieces" id="wrongBank" aria-label="違うよから出たアルファベット"></div>
      </div>

      <div class="cut-stage tool-active" id="cutStage">
        <article class="cut-target" id="boardCard" data-object="board">
          <div class="object-view">
            <div class="board-shape" id="boardShape" aria-hidden="true">
              <img class="object-image" src="assets/board-web-v2.png" alt="" draggable="false">
              <span class="saw-groove" id="sawGroove"></span>
            </div>
          </div>
          <div class="piece-bank" id="boardBank" aria-label="板から出た文字"></div>
        </article>

        <article class="cut-target" id="lettuceCard" data-object="lettuce">
          <div class="object-view">
            <div class="lettuce-shape" id="lettuceShape" aria-hidden="true">
              <img class="object-image" src="assets/lettuce-web.png" alt="" draggable="false">
              <span class="cut-line"></span>
            </div>
          </div>
          <div class="piece-bank" id="lettuceBank" aria-label="レタスから出た文字"></div>
        </article>
      </div>

      <section class="answer-area" id="answerArea" aria-label="答えを作る場所">
        <div class="answer-source-zone">
          <div class="cut-source-wrap">
            <span class="cut-source tool-locked" id="cutSource" contenteditable="false" spellcheck="false" aria-label="答え"><span class="source-char" data-source-char="kanji">答</span><span class="source-char" data-source-char="kana">え</span></span>
          </div>
          <div class="source-pieces" id="sourceBank" aria-label="文字から出たアルファベット"></div>
        </div>

        <div class="answer-slots" id="answerSlots" aria-label="7文字の答え">
          <div class="answer-slot" data-slot="0"></div>
          <div class="answer-slot" data-slot="1"></div>
          <div class="answer-slot" data-slot="2"></div>
          <div class="answer-slot" data-slot="3"></div>
          <div class="answer-slot" data-slot="4"></div>
          <div class="answer-slot" data-slot="5"></div>
          <div class="answer-slot" data-slot="6"></div>
        </div>

        <div class="answer-actions">
          <button class="action-button" id="clearAnswerButton" type="button">クリア</button>
          <button class="action-button primary" id="checkButton" type="button">決定</button>
        </div>
      </section>
    </section>
  </main>

  <div class="modal" id="clearModal" role="dialog" aria-modal="true" aria-labelledby="clearTitle" hidden>
    <div class="modal-card">
      <h2 id="clearTitle">お宝とホタテを見つけました！</h2>
      <div class="answer-actions">
        <a class="action-button primary" id="shareButton" href="#" target="_blank" rel="noopener noreferrer">Xにシェア</a>
        <button class="action-button" id="closeModal" type="button">とじる</button>
      </div>
    </div>
  </div>

  <div class="modal" id="statsModal" role="dialog" aria-modal="true" aria-labelledby="statsTitle" hidden>
    <div class="modal-card">
      <h2 id="statsTitle">記録</h2>
      <dl class="stats-list">
        <div class="stats-row"><dt>総プレイ回数</dt><dd id="playCount">—</dd></div>
        <div class="stats-row"><dt>クリア数</dt><dd id="clearCount">—</dd></div>
      </dl>
      <p class="stats-note">この画面は謎解きと関係ありません。</p>
      <button class="action-button" id="closeStats" type="button">とじる</button>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const state = {
        objects: { board: false, lettuce: false },
        source: { kanji: false, kana: false, wrong: false },
        selectedTool: "saw",
        phase: 1,
        wrongVisible: false,
        cutGesture: null,
        tileNumber: 0,
        noneClicks: 0,
        clearRecorded: false
      };

      const objectData = {
        board: { letters: "ITA", bank: "boardBank", card: "boardCard" },
        lettuce: { letters: "RETASU", bank: "lettuceBank", card: "lettuceCard" }
      };

      const answerArea = document.getElementById("answerArea");
      const answerSlotsElement = document.getElementById("answerSlots");
      const answerSlots = [...document.querySelectorAll(".answer-slot")];
      const cutSource = document.getElementById("cutSource");
      const wrongSource = document.getElementById("wrongSource");
      const wrongBank = document.getElementById("wrongBank");
      const gameTitle = document.getElementById("gameTitle");
      const clearModal = document.getElementById("clearModal");
      const statsModal = document.getElementById("statsModal");
      const playCount = document.getElementById("playCount");
      const clearCount = document.getElementById("clearCount");
      const cutStage = document.getElementById("cutStage");
      const toolToggle = document.getElementById("toolToggle");
      const toolMenu = document.getElementById("toolMenu");

      const pointInRect = (x, y, rect, padding = 0) => (
        x >= rect.left - padding && x <= rect.right + padding &&
        y >= rect.top - padding && y <= rect.bottom + padding
      );

      const createTile = (letter, home, delay = 0) => {
        const tile = document.createElement("button");
        tile.type = "button";
        tile.className = "letter-tile";
        tile.textContent = letter;
        tile.setAttribute("aria-label", `${letter}の文字`);
        tile.style.animationDelay = `${delay}ms`;
        tile.dataset.tileId = String(++state.tileNumber);
        tile._home = home;
        home.classList.add("has-pieces");
        home.appendChild(tile);
        tile.addEventListener("click", handleTileClick);
        return tile;
      };

      const releaseObject = (name) => {
        if (state.objects[name]) return;
        state.objects[name] = true;
        const data = objectData[name];
        const card = document.getElementById(data.card);
        const bank = document.getElementById(data.bank);

        if (name === "lettuce") card.classList.add("flash-cut");
        card.classList.add("is-cut");
        [...data.letters].forEach((letter, index) => createTile(letter, bank, 75 + index * 48));
      };

      const chooseTool = (tool) => {
        state.selectedTool = tool;
        const labels = { none: "なし", saw: "のこぎり", knife: "包丁" };
        toolToggle.textContent = `TOOLS：${labels[tool]}`;
        document.querySelectorAll(".tool-choice").forEach(choice => {
          const selected = choice.dataset.tool === tool;
          choice.classList.toggle("is-selected", selected);
          choice.setAttribute("aria-checked", String(selected));
        });
        cutStage.classList.toggle("tool-active", tool !== "none");
        const answerEditable = tool === "none" && !state.source.kanji;
        const wrongEditable = tool === "none" && state.wrongVisible && !state.source.wrong;
        cutSource.classList.toggle("tool-locked", !answerEditable);
        wrongSource.classList.toggle("tool-locked", !wrongEditable);
        cutSource.setAttribute("contenteditable", String(answerEditable));
        wrongSource.setAttribute("contenteditable", String(wrongEditable));
        if (!answerEditable && document.activeElement === cutSource) {
          window.getSelection().removeAllRanges();
          cutSource.blur();
        }
        if (!wrongEditable && document.activeElement === wrongSource) {
          window.getSelection().removeAllRanges();
          wrongSource.blur();
        }
        toolMenu.hidden = true;
        toolToggle.setAttribute("aria-expanded", "false");
      };

      toolToggle.addEventListener("click", () => {
        const willOpen = toolMenu.hidden;
        toolMenu.hidden = !willOpen;
        toolToggle.setAttribute("aria-expanded", String(willOpen));
      });

      const getVisitorId = () => {
        const key = "kiritoriVisitorId";
        let visitorId = localStorage.getItem(key);
        if (!visitorId) {
          visitorId = typeof crypto.randomUUID === "function"
            ? crypto.randomUUID()
            : `${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;
          localStorage.setItem(key, visitorId);
        }
        return visitorId;
      };

      const statsRequest = async (action = "") => {
        const options = action
          ? {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action, visitorId: getVisitorId() })
            }
          : { cache: "no-store" };
        const response = await fetch("stats.php", options);
        if (!response.ok) throw new Error("stats unavailable");
        return response.json();
      };

      const openStats = async () => {
        statsModal.hidden = false;
        playCount.textContent = "…";
        clearCount.textContent = "…";
        document.getElementById("closeStats").focus();
        try {
          const stats = await statsRequest();
          playCount.textContent = String(stats.plays);
          clearCount.textContent = String(stats.clears);
        } catch (_) {
          playCount.textContent = "—";
          clearCount.textContent = "—";
        }
      };

      statsRequest("visit").catch(() => {});

      document.querySelectorAll(".tool-choice").forEach(choice => {
        choice.addEventListener("click", () => {
          if (choice.dataset.tool === "none") {
            state.noneClicks += 1;
            if (state.noneClicks >= 8) {
              state.noneClicks = 0;
              openStats();
            }
          } else {
            state.noneClicks = 0;
          }
          chooseTool(choice.dataset.tool);
        });
      });

      document.addEventListener("pointerdown", (event) => {
        if (!event.target.closest(".toolbox")) {
          toolMenu.hidden = true;
          toolToggle.setAttribute("aria-expanded", "false");
        }
      });

      const startCutGesture = (event) => {
        if (state.selectedTool === "none") return;
        if (event.button !== undefined && event.button !== 0) return;
        if (event.target.closest(".letter-tile")) return;
        event.preventDefault();
        cutStage.setPointerCapture(event.pointerId);
        state.cutGesture = {
          type: state.selectedTool,
          pointerId: event.pointerId,
          lastX: event.clientX,
          lastY: event.clientY,
          lastTime: performance.now(),
          sawAnchor: null,
          sawVector: null,
          sawTurns: 0,
          touchedWrong: false
        };
      };

      const moveCutGesture = (event) => {
        const drag = state.cutGesture;
        if (!drag || event.pointerId !== drag.pointerId) return;
        event.preventDefault();

        const now = performance.now();
        const dx = event.clientX - drag.lastX;
        const dy = event.clientY - drag.lastY;
        const elapsed = Math.max(1, now - drag.lastTime);
        const speed = Math.hypot(dx, dy) / elapsed;
        const boardRect = document.getElementById("boardShape").getBoundingClientRect();
        const lettuceRect = document.getElementById("lettuceShape").getBoundingClientRect();
        const onBoard = pointInRect(event.clientX, event.clientY, boardRect, 8);
        const onLettuce = pointInRect(event.clientX, event.clientY, lettuceRect, 8);

        document.getElementById("boardCard").classList.toggle("tool-over", onBoard && !state.objects.board);
        document.getElementById("lettuceCard").classList.toggle("tool-over", onLettuce && !state.objects.lettuce);

        if (drag.type === "saw" && onBoard && !state.objects.board) {
          if (drag.sawAnchor === null) {
            drag.sawAnchor = { x: event.clientX, y: event.clientY };
          }
          const travelX = event.clientX - drag.sawAnchor.x;
          const travelY = event.clientY - drag.sawAnchor.y;
          const travel = Math.hypot(travelX, travelY);
          if (travel >= 15) {
            const vector = { x: travelX / travel, y: travelY / travel };
            if (drag.sawVector) {
              const directionDot = drag.sawVector.x * vector.x + drag.sawVector.y * vector.y;
              if (directionDot <= -0.55) drag.sawTurns += 1;
            }
            drag.sawVector = vector;
            drag.sawAnchor = { x: event.clientX, y: event.clientY };
            const groove = document.getElementById("sawGroove");
            groove.style.height = `${Math.min(62, 8 + drag.sawTurns * 11)}px`;
            if (drag.sawTurns >= 5) releaseObject("board");
          }
        } else if (!onBoard) {
          drag.sawAnchor = null;
          drag.sawVector = null;
        }

        if (drag.type === "knife" && onLettuce && !state.objects.lettuce && speed >= 0.55 && Math.hypot(dx, dy) >= 12) {
          releaseObject("lettuce");
        }

        if ((drag.type === "saw" && onLettuce) || (drag.type === "knife" && onBoard)) {
          drag.touchedWrong = true;
        }

        drag.lastX = event.clientX;
        drag.lastY = event.clientY;
        drag.lastTime = now;
      };

      const endCutGesture = (event) => {
        const drag = state.cutGesture;
        if (!drag || event.pointerId !== drag.pointerId) return;
        document.querySelectorAll(".cut-target").forEach(card => card.classList.remove("tool-over"));
        state.cutGesture = null;
      };

      cutStage.addEventListener("pointerdown", startCutGesture);
      cutStage.addEventListener("pointermove", moveCutGesture);
      cutStage.addEventListener("pointerup", endCutGesture);
      cutStage.addEventListener("pointercancel", endCutGesture);

      const returnTileHome = (tile) => {
        const home = tile._home;
        const tileId = Number(tile.dataset.tileId);
        const next = [...home.querySelectorAll(":scope > .letter-tile")]
          .find(candidate => Number(candidate.dataset.tileId) > tileId);
        home.insertBefore(tile, next || null);
      };

      const handleTileClick = (event) => {
        const tile = event.currentTarget;
        const parent = tile.parentElement;
        if (parent.classList.contains("answer-slot")) {
          returnTileHome(tile);
          return;
        }
        const emptySlot = answerSlots.find(slot => !slot.hidden && !slot.querySelector(".letter-tile"));
        if (emptySlot) emptySlot.appendChild(tile);
      };

      const sourceSelection = () => {
        const selection = window.getSelection();
        if (!selection || selection.rangeCount === 0 || selection.isCollapsed) return null;
        const range = selection.getRangeAt(0);
        for (const source of [cutSource, wrongSource]) {
          if (!source.contains(range.commonAncestorContainer)) continue;
          const chars = [...source.querySelectorAll(".source-char")].filter(char => {
            try { return range.intersectsNode(char) && !char.classList.contains("is-cut"); }
            catch (_) { return false; }
          });
          if (chars.length) return { source, chars };
        }
        return null;
      };

      document.addEventListener("cut", (event) => {
        const selected = sourceSelection();
        if (!selected) return;
        if (state.selectedTool !== "none") {
          event.preventDefault();
          window.getSelection().removeAllRanges();
          selected.source.blur();
          return;
        }
        event.preventDefault();
        const bank = selected.source === wrongSource ? wrongBank : document.getElementById("sourceBank");
        let copied = "";
        let delay = 0;

        selected.chars.forEach(char => {
          const kind = char.dataset.sourceChar;
          if (state.source[kind]) return;
          state.source[kind] = true;
          const letters = kind === "kanji" ? "KOTA" : kind === "kana" ? "E" : "CHIGAUYO";
          copied += letters;
          char.classList.add("is-cut");
          [...letters].forEach(letter => {
            createTile(letter, bank, delay);
            delay += 45;
          });
        });

        if (event.clipboardData) event.clipboardData.setData("text/plain", copied);
        window.getSelection().removeAllRanges();
        if (state.source.kanji) {
          cutSource.setAttribute("contenteditable", "false");
          cutSource.classList.add("is-exhausted");
        }
        if (state.source.wrong) {
          wrongSource.setAttribute("contenteditable", "false");
          wrongSource.classList.add("is-exhausted");
        }
        selected.source.blur();
      });

      const protectSource = (source, expected) => {
        source.addEventListener("beforeinput", (event) => event.preventDefault());
        source.addEventListener("keydown", (event) => {
          const shortcut = (event.metaKey || event.ctrlKey) && ["a", "c", "x"].includes(event.key.toLowerCase());
          if (!shortcut && (event.key.length === 1 || ["Backspace", "Delete", "Enter"].includes(event.key))) {
            event.preventDefault();
          }
        });
        source.addEventListener("input", () => {
          [...source.childNodes].forEach(node => {
            if (node.nodeType !== Node.ELEMENT_NODE || !node.classList.contains("source-char")) node.remove();
          });
          source.querySelectorAll(".source-char").forEach(char => {
            char.textContent = expected[char.dataset.sourceChar];
          });
        });
        source.addEventListener("paste", (event) => event.preventDefault());
        source.addEventListener("drop", (event) => event.preventDefault());
      };

      protectSource(cutSource, { kanji: "答", kana: "え" });
      protectSource(wrongSource, { wrong: "違うよ" });

      const showWrong = () => {
        state.wrongVisible = true;
        wrongSource.classList.add("is-visible");
        chooseTool(state.selectedTool);
      };

      const consumeAnswerTiles = () => {
        answerSlots.forEach(slot => {
          const tile = slot.querySelector(".letter-tile");
          if (tile) tile.remove();
        });
      };

      const hideWrongSource = () => {
        state.wrongVisible = false;
        wrongSource.classList.remove("is-visible");
        wrongSource.classList.add("tool-locked");
        wrongSource.setAttribute("contenteditable", "false");
        window.getSelection().removeAllRanges();
        wrongSource.blur();
      };

      const rejectAnswer = () => {
        showWrong();
        answerArea.classList.remove("wrong");
        void answerArea.offsetWidth;
        answerArea.classList.add("wrong");
      };

      const enterSecondPhase = () => {
        state.phase = 2;
        gameTitle.textContent = "ホタテを見つけよう";
        consumeAnswerTiles();
        hideWrongSource();
        answerSlots[6].hidden = true;
        answerSlotsElement.classList.add("is-six");
        answerSlotsElement.setAttribute("aria-label", "6文字の答え");
      };

      document.getElementById("checkButton").addEventListener("click", () => {
        const activeSlots = answerSlots.filter(slot => !slot.hidden);
        const filled = activeSlots.every(slot => slot.querySelector(".letter-tile"));
        const answer = activeSlots.map(slot => slot.textContent.trim()).join("");
        if (state.phase === 1 && filled && answer === "OTAKARA") {
          enterSecondPhase();
          return;
        }
        if (state.phase === 2 && filled && answer === "HOTATE") {
          clearModal.hidden = false;
          if (!state.clearRecorded) {
            state.clearRecorded = true;
            statsRequest("clear").catch(() => {});
          }
          document.getElementById("closeModal").focus();
          return;
        }
        rejectAnswer();
      });

      document.getElementById("closeModal").addEventListener("click", () => {
        clearModal.hidden = true;
      });

      clearModal.addEventListener("click", (event) => {
        if (event.target === clearModal) clearModal.hidden = true;
      });

      document.getElementById("closeStats").addEventListener("click", () => {
        statsModal.hidden = true;
      });

      statsModal.addEventListener("click", (event) => {
        if (event.target === statsModal) statsModal.hidden = true;
      });

      const shareText = "WEB謎「kiritori」を解きました！\n\nhttps://sajiqook.jp/game/kiritori\n\n\n#kiritori\nhttps://x.com/saji_qook/status/2095285673003811273?s=20";
      document.getElementById("shareButton").href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}`;

      document.getElementById("clearAnswerButton").addEventListener("click", () => {
        answerSlots.forEach(slot => {
          const tile = slot.querySelector(".letter-tile");
          if (tile) returnTileHome(tile);
        });
      });
    })();
  </script>
</body>
</html>
